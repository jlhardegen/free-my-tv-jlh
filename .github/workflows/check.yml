# Builds the Samsung app and checks the catalogues on every pull request and push to main, with tools/check.sh: the same
# script contributors run before pushing, so a PR shows whether it still builds before anyone tries it on a TV.
name: Check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A new push to a PR cancels the run for the push before it (on main, every merge keeps its own run).
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  samsung:
    name: Translations and Samsung
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: bash tools/check.sh
