# Publishes a GitHub release with FreeMyTV-tizen.wgt, the package TizenBrew Installer and your own install take. Runs only
# when you start it by hand: Actions → Release → Run workflow. The release is tagged with the version in tizen/config.xml,
# so bump that version first: a version that already has a release stops the run and nothing is replaced.
#
# The package is built without config.properties (no TMDB key, the city from the TV's time zone), as the upstream
# releases are. It is not signed here: TVs from 2023 take it as it is (TizenBrew Installer signs it with their Samsung
# certificate), but 2017-2022 TVs need a package signed with the author certificate (tizen/build.py --sign).
name: Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check the catalogues and the web app
        run: bash tools/check.sh
      - name: Build the package
        run: python3 tizen/build.py --generic
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(sed -n 's/.*<widget [^>]*version="\([^"]*\)".*/\1/p' tizen/config.xml | head -1)"
          if [ -z "$version" ]; then echo "No version in tizen/config.xml." >&2; exit 1; fi
          gh release create "v$version" FreeMyTV-tizen.wgt \
            --target "$GITHUB_SHA" \
            --title "Free My TV $version (Samsung)" \
            --notes "Samsung package for TizenBrew Installer and Samsung's Developer Mode. Built without a TMDB key: type yours in Home Settings on the TV."
