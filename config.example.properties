# Free My TV settings. The first build copies this file to config.properties; edit that one and rebuild.
# Your settings and keys stay on your computer: config.properties is never committed.

# Free key from https://www.themoviedb.org/settings/api (the "API Read Access Token" or the "API Key").
# Without it, the home screen still works, just without the trending picks.
tmdb_key=

# Your country (two letters): decides which titles are on which streaming app. US, GB, CA, BR, DE, FR...
tmdb_region=US

# Your city, for the weather and the sunset that turns the home screen dark at night (decimal degrees).
latitude=40.7128
longitude=-74.0060
# Optional: the name shown on the weather card (empty = "Weather").
city=

# true leaves cartoons and anime (TMDB's Animation genre) out of the picks. Home Settings changes it on the TV
# ("Cartoons and anime").
hide_animation=false

# auto follows the TV's language; or a language code with a translation (en, pt, es, de, ru, fr, ja...).
language=auto

# true shows Binance crypto prices on the home screen and the screensaver.
show_crypto=true

# Crypto prices: USD, BRL, EUR... (used only when show_crypto=true)
currency=USD

# C, F, or auto (Fahrenheit when the TV is set to the US)
temperature=auto

# 24 or 12 forces the clock (24-hour: 15:07), auto follows the language (English is 12-hour).
# Home Settings > Clock on the TV wins over it.
clock_format=auto

# Home screen look: auto (dark from sunset to sunrise), light or dark
theme=auto

# Streaming services to leave out of the picks even when their app is on the TV, comma separated:
# netflix, prime, disney, hbo, ... For apps the TV ships that you don't subscribe to (Prime Video on a Sony, Samsung's
# built-in Netflix). The same switches are in Home Settings (Picks from); this is where they start, and the TV's wins.
hide_services=

# Apps to leave out of the shelf, All Apps and the picks, comma separated, by id or name (part of it, any case).
# For apps the TV ships that can't be uninstalled, like Samsung's built-in Netflix: hide_apps=netflix
hide_apps=

# The shelf's apps in this order, comma separated, by id or name (part of it, any case), in place of the built-in
# order. Changing it here wins once over the shelf picked on the TV. A whole app id also brings an app the TV leaves
# out of its list (one installed in Developer Mode): shelf_apps=youtube,netflix,spotify
shelf_apps=

# true opens the home screen with the drawer already out (apps in the middle, inputs, weather and prices below), so
# nothing has to be scrolled to reach the inputs; Back closes it to the full page. For a TV whose streaming apps live on
# a box, where the picks stay empty.
drawer_first=false

# Samsung (Tizen 3 and newer; tried on one 2023 Tizen 9 TV): true brings Free My TV back when Home is pressed in an app
# opened from it. No app may take Samsung's Home key, so Free My TV keeps running behind that app and asks the TV, a
# few times a second, whether it still shows; Smart Hub shows for a moment, then Free My TV. Anything else that takes
# the screen from that app (another input, an app opened by voice or from a phone) brings it back too. Home Settings
# changes it on the TV ("Home button"). Only in your own build: it changes the package's manifest, so going from a
# build without it to one with it can mean uninstalling first on older TVs. Leave it false on 2015 and 2016 TVs
# (Tizen 2), where it does nothing and the package may not install.
samsung_home_button=false

# Optional: a free Watchmode key (watchmode.com) makes a Prime Video pick open the title's own page in the app.
# Without it, the picks open the app. Disney+, Netflix and HBO Max open at home whatever they're sent.
watchmode_key=
